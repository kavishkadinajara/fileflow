name: CI

on:
  push:
    branches: [main, production-bug-fix-*]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Type-check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Stub values so Next.js build doesn't fail on missing env vars.
          # Real values are set in Vercel project settings.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'stub-for-build' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
